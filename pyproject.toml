[project]
name = "orchestrate-claim-verification"
version = "1.0.0"
description = "Multi-modal damage-claim verification (provider-agnostic, deterministic-policy hybrid)."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".cache", "logs"]

[tool.ruff.lint]
select = ["E", "F", "B"]
# E501: long lines tolerated (prompts/tables). B905: zip(strict=) cosmetic.
# I/import-sort not enforced — the `sys.path.insert` entry-point shim needs imports
# after a statement, which conflicts with isort ordering.
ignore = ["E501", "B905"]
